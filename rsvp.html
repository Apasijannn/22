    @media (prefers-reduced-motion: reduce) {

        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .warm-pulse-cta {
        animation: none !important;
      }
      #runawayButton {
        transition: none !important;
      }
    }

<script>
  (function() {
    const runawayBtn = document.getElementById('runawayButton');
    const warningLabel = document.getElementById('playfulWarning');
    const acceptBtn = document.getElementById('acceptButton');
    const modal = document.getElementById('confirmationModal');
    const closeModalBtn = document.getElementById('closeModalBtn');

    let escapes = 0;
    const phrases = [
      "Nice try! Still reserved for you 🥂",
      "Almost got it! But destiny says yes ✨",
      "Running fast! Table is waiting 🌹",
      "Resistance is futile, dessert is included! 🍓"
    ];

    function runAway(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      escapes++;
      // Calculate dynamic dodge vectors
      const signX = Math.random() > 0.5 ? 1 : -1;
      const signY = Math.random() > 0.5 ? 1 : -1;
      const randomX = signX * (45 + Math.random() * 75);
      const randomY = signY * (20 + Math.random() * 40);
      const randomRot = (Math.random() - 0.5) * 26;

      runawayBtn.style.transform = `translate(${randomX}px, ${randomY}px) rotate(${randomRot}deg) scale(0.96)`;
      
      if (escapes < phrases.length) {
        warningLabel.textContent = phrases[escapes - 1];
        warningLabel.classList.remove('opacity-75');
        warningLabel.classList.add('opacity-100');
      } else {
        warningLabel.textContent = "Okay, that's it — it's 100% official now! ❤️";
        runawayBtn.style.opacity = "0";
        runawayBtn.style.pointerEvents = "none";
        setTimeout(() => {
          runawayBtn.style.display = "none";
        }, 320);
      }
    }

    runawayBtn.addEventListener('mouseenter', runAway);
    runawayBtn.addEventListener('touchstart', runAway, { passive: false });
    runawayBtn.addEventListener('pointerdown', runAway);

    // ---- RSVP over WhatsApp -----------------------------------------
    // Paste your number below: international format, digits only, no + or spaces.
    const RSVP_WHATSAPP_NUMBER = "6281298891193";
    const RSVP_MESSAGE = "Yes yes yes, can't wait 🥂✨";

    acceptBtn.addEventListener('click', function() {
      modal.classList.remove('hidden');
      window.open(
        `https://wa.me/${RSVP_WHATSAPP_NUMBER}?text=${encodeURIComponent(RSVP_MESSAGE)}`,
        '_blank'
      );
    });

    closeModalBtn.addEventListener('click', function() {
      modal.classList.add('hidden');
    });
  })();
</script></main><footer class="relative z-10 w-full text-center pt-3 pb-[calc(14px+env(safe-area-inset-bottom))] font-label-sm text-[10px] uppercase tracking-[0.28em] text-secondary/50 select-none">An Evening, Just For Two</footer></body></html>
