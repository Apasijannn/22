@layer base {

::-webkit-scrollbar { display: none; }

@keyframes forwardEntrance {
  0% {
    opacity: 0;
    transform: translateY(14px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes polaroidFloatReveal {
  0% {
    opacity: 0;
    transform: translateY(20px) scale(0.96);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.animate-forward-entrance {
  animation: forwardEntrance 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.animate-polaroid-reveal {
  animation: polaroidFloatReveal 0.85s cubic-bezier(0.2, 0.9, 0.3, 1) 0.15s both;
}

.polaroid-paper {
  background-color: var(--color-paper-raised);
  background-image: radial-gradient(var(--color-paper-sunken) 0.75px, transparent 0.75px);
  background-size: 10px 10px;
  box-shadow: 0 16px 36px -8px rgba(36, 51, 31, 0.16), 0 4px 12px rgba(0, 0, 0, 0.05);
}

.forward-action-btn:hover .forward-icon,
.forward-action-btn:focus-visible .forward-icon,
.forward-action-btn:active .forward-icon {
  transform: translateX(4px);
}

@media (prefers-reduced-motion: reduce) {
  .animate-forward-entrance,
  .animate-polaroid-reveal {
    animation: none !important;
    opacity: 1 !important;
    transform: none !important;
  }
  .forward-action-btn .forward-icon {
    transform: none !important;
    transition: none !important;
  }
  * {
    transition-duration: 0.01ms !important;
  }
}

<script>
  (function() {
    let currentIndex = 0;
    const cards = [
      document.getElementById('card-1'),
      document.getElementById('card-2'),
      document.getElementById('card-3')
    ];
    const indicators = [
      document.getElementById('indicator-1'),
      document.getElementById('indicator-2'),
      document.getElementById('indicator-3')
    ];

    const cardTransforms = [
      { transform: 'rotate(-1deg) translateY(0px) scale(1)', zIndex: '30' },
      { transform: 'rotate(3deg) translateY(8px) scale(0.98)', zIndex: '20' },
      { transform: 'rotate(-4deg) translateY(16px) scale(0.95)', zIndex: '10' }
    ];

    function updateCards() {
      cards.forEach((card, idx) => {
        const offset = (idx - currentIndex + 3) % 3;
        card.style.transform = cardTransforms[offset].transform;
        card.style.zIndex = cardTransforms[offset].zIndex;
      });

      indicators.forEach((ind, idx) => {
        if (idx === currentIndex) {
          ind.className = 'w-2 h-2 rounded-full bg-tertiary-container transition-all';
        } else {
          ind.className = 'w-1.5 h-1.5 rounded-full bg-outline-variant transition-all';
        }
      });
    }

    const nextBtn = document.getElementById('next-btn');
    const prevBtn = document.getElementById('prev-btn');

    if (nextBtn) {
      nextBtn.addEventListener('click', () => {
        currentIndex = (currentIndex + 1) % 3;
        updateCards();
      });
    }

    if (prevBtn) {
      prevBtn.addEventListener('click', () => {
        currentIndex = (currentIndex - 1 + 3) % 3;
        updateCards();
      });
    }

    cards.forEach((c) => {
      if (c) {
        c.addEventListener('click', () => {
          currentIndex = (currentIndex + 1) % 3;
          updateCards();
        });
      }
    });

    let startX = 0;
    const container = document.querySelector('.relative.h-\\[430px\\]');
    if (container) {
      container.addEventListener('touchstart', (e) => {
        startX = e.changedTouches[0].screenX;
      }, { passive: true });

      container.addEventListener('touchend', (e) => {
        const endX = e.changedTouches[0].screenX;
        if (startX - endX > 40) {
          currentIndex = (currentIndex + 1) % 3;
          updateCards();
        } else if (endX - startX > 40) {
          currentIndex = (currentIndex - 1 + 3) % 3;
          updateCards();
        }
      }, { passive: true });
    }
  })();
</script></main></body></html>
