<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><title>A Table Reserved For You</title><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><link href="assets/design-tokens.css" rel="stylesheet"><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script src="assets/tailwind.tokens.js"></script><style>
@layer base {
  html, body { width: 100vw; margin: 0; padding: 0; }
  body { overscroll-behavior: none; }
  .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
  .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
  main > :first-child { margin-top: 0 !important; }
  main > :last-child { margin-bottom: 0 !important; }
}
::-webkit-scrollbar { display: none; }

@keyframes forwardEntrance {
  0% {
    opacity: 0;
    transform: translateY(14px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes polaroidFloatReveal {
  0% {
    opacity: 0;
    transform: translateY(20px) scale(0.96);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.animate-forward-entrance {
  animation: forwardEntrance 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.animate-polaroid-reveal {
  animation: polaroidFloatReveal 0.85s cubic-bezier(0.2, 0.9, 0.3, 1) 0.15s both;
}

.polaroid-paper {
  background-color: var(--color-paper-raised);
  box-shadow: 0 16px 36px -8px rgba(36, 51, 31, 0.16), 0 4px 12px rgba(0, 0, 0, 0.05);
}

.forward-action-btn:hover .forward-icon,
.forward-action-btn:focus-visible .forward-icon,
.forward-action-btn:active .forward-icon {
  transform: translateX(4px);
}

@media (prefers-reduced-motion: reduce) {
  .animate-forward-entrance,
  .animate-polaroid-reveal {
    animation: none !important;
    opacity: 1 !important;
    transform: none !important;
  }
  .forward-action-btn .forward-icon {
    transform: none !important;
    transition: none !important;
  }
  * {
    transition-duration: 0.01ms !important;
  }
}
</style></head><body class="bg-surface text-on-surface font-body-md text-body-md flex flex-col min-h-screen relative selection:bg-secondary-fixed selection:text-on-secondary-fixed"><main class="flex-1 flex flex-col relative w-full px-gutter-mobile pt-[calc(28px+env(safe-area-inset-top))] bg-surface pb-8"><div class="animate-forward-entrance flex flex-col w-full max-w-md mx-auto relative px-2 py-4">

<!-- Delicate floating gold filigree leaf buds -->

<!-- Polaroid deck, built from PHOTOS in the script below -->
<!-- Full-size layer: the cards are absolute with no offsets, so they take
     their position from this flex centring - a shrink-wrapped wrapper would
     park them at its own zero-width corner and let them run off-screen. -->
<div class="absolute inset-0 z-10 flex items-center justify-center" id="card-deck"></div>
</div>
<!-- Dots Navigation -->
<div class="flex items-center justify-center gap-2 mb-4">
<button aria-label="Previous card" class="w-7 h-7 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant hover:text-primary active:scale-95 transition-all" id="prev-btn">
<span class="material-symbols-outlined text-[16px]">west</span>
</button>
<div class="flex items-center gap-1 px-3 py-1 rounded-full bg-surface-container-high" id="indicator-row"></div>
<button aria-label="Next card" class="w-7 h-7 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant hover:text-primary active:scale-95 transition-all" id="next-btn">
<span class="material-symbols-outlined text-[16px]">east</span>
</button>
</div>
<!-- Delicate Botanical Quote Line (Replacing bulky notes box) -->
<div class="flex flex-col items-center text-center px-4 py-2 mb-4">
<p class="font-headline-sm text-sm italic text-secondary/90 tracking-wide">
    “Every photo, a little piece of us.”
  </p>
<div class="flex items-center justify-center gap-2 mt-2">
<span class="h-[1px] w-6 bg-outline-variant/60"></span>
<span class="material-symbols-outlined text-[13px] text-[var(--color-foil)]">spa</span>
<span class="h-[1px] w-6 bg-outline-variant/60"></span>
</div>
</div>
<!-- Simplified Forward Action Button -->
<div class="w-full pt-1">
<a aria-disabled="true" class="forward-action-btn w-full flex items-center justify-center gap-2 py-3.5 px-6 rounded-xl bg-primary text-on-primary shadow-md hover:bg-primary-container active:scale-[0.99] transition-all duration-300 opacity-40 pointer-events-none" href="trivia.html" id="continueLink">
<span class="font-headline-sm text-lg tracking-wide text-on-primary font-normal">Continue</span>
<span class="material-symbols-outlined text-[18px] forward-icon transition-transform duration-300 ease-out">arrow_forward</span>
</a>
<p class="text-center font-label-sm text-[10px] uppercase tracking-widest text-secondary/70 mt-2" id="stackHint">The photos are turning themselves</p>
</div>
</div>
<script>
  (function() {
    // The photos, in order. Drop a file into galeri/duo and add its path here.
    const PHOTOS = [
      'galeri/duo/WhatsApp Image 2026-09-21 at 03.29.21.jpeg',
      'galeri/duo/WhatsApp Image 2026-09-21 at 03.32.20.jpeg',
      'galeri/duo/WhatsApp Image 2026-09-21 at 03.34.43.jpeg',
      'galeri/duo/WhatsApp Image 2026-09-21 at 03.36.03.jpeg',
      'galeri/duo/WhatsApp Image 2026-09-21 at 03.37.02.jpeg',
      'galeri/duo/WhatsApp Image 2026-09-21 at 03.38.38.jpeg',
      'galeri/duo/WhatsApp Image 2026-09-21 at 03.39.25.jpeg',
      'galeri/duo/WhatsApp Image 2026-09-21 at 03.39.55.jpeg',
      'galeri/duo/WhatsApp Image 2026-09-21 at 03.40.29.jpeg',
      'galeri/duo/WhatsApp Image 2026-09-21 at 03.41.13.jpeg'
    ];

    const deck = document.getElementById('card-deck');
    const indicatorRow = document.getElementById('indicator-row');

    // Only the front three are visible; the rest wait behind the bottom card.
    const cardTransforms = [
      { transform: 'rotate(-1deg) translateY(0px) scale(1)', zIndex: '30', opacity: '1' },
      { transform: 'rotate(3deg) translateY(8px) scale(0.98)', zIndex: '20', opacity: '1' },
      { transform: 'rotate(-4deg) translateY(16px) scale(0.95)', zIndex: '10', opacity: '1' }
    ];
    const BURIED = { transform: 'rotate(-4deg) translateY(16px) scale(0.95)', zIndex: '0', opacity: '0' };

    // Filenames carry spaces, so every path is encoded before it reaches src.
    deck.innerHTML = PHOTOS.map(function (src, i) {
      // max-w keeps the 4:5 photo shorter than the 430px stack area on wide
      // screens, where 86% of the container would grow past it and spill onto
      // the quote and the button below.
      return '<div class="polaroid-paper absolute w-[86%] max-w-[320px] transition-all duration-500 rounded-lg p-3.5 pb-3.5 cursor-pointer">'
        + '<div class="relative w-full aspect-[4/5] bg-surface-container-high rounded overflow-hidden">'
        + '<img alt="Memory ' + (i + 1) + '" class="w-full h-full object-cover" src="' + encodeURI(src) + '">'
        + '<div class="absolute -top-1.5 left-1/2 -translate-x-1/2 w-14 h-4 bg-amber-100/70 border-t border-b border-amber-200/50 backdrop-blur-sm shadow-sm rotate-[-2deg]"></div>'
        + '</div></div>';
    }).join('');

    indicatorRow.innerHTML = PHOTOS.map(function () {
      return '<span class="w-1.5 h-1.5 rounded-full bg-outline-variant transition-all"></span>';
    }).join('');

    const cards = Array.prototype.slice.call(deck.children);
    const indicators = Array.prototype.slice.call(indicatorRow.children);
    const COUNT = cards.length;
    let currentIndex = 0;

    function updateCards() {
      cards.forEach(function (card, idx) {
        const offset = (idx - currentIndex + COUNT) % COUNT;
        const look = cardTransforms[offset] || BURIED;
        card.style.transform = look.transform;
        card.style.zIndex = look.zIndex;
        card.style.opacity = look.opacity;
      });

      indicators.forEach(function (ind, idx) {
        ind.className = idx === currentIndex
          ? 'w-2 h-2 rounded-full bg-tertiary-container transition-all'
          : 'w-1.5 h-1.5 rounded-full bg-outline-variant transition-all';
      });
    }

    // The deck turns itself over; a guest who takes over pauses it.
    const DWELL = 2600;      // time a photo sits on top before the next turn
    const RESUME = 4000;     // quiet time after a manual turn before resuming
    const UNLOCK_AFTER = Math.min(5, COUNT);  // photos seen before Continue opens
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const link = document.getElementById('continueLink');
    const hint = document.getElementById('stackHint');
    const seen = new Set([0]);
    let autoTimer = null;
    let resumeTimer = null;

    function unlock() {
      if (!link || !link.hasAttribute('aria-disabled')) return;
      link.classList.remove('opacity-40', 'pointer-events-none');
      link.removeAttribute('aria-disabled');
      if (hint) hint.remove();
    }

    // Enough of the deck seen, by timer or by hand, opens the way forward.
    function turn(delta) {
      currentIndex = (currentIndex + delta + COUNT) % COUNT;
      updateCards();
      seen.add(currentIndex);
      if (seen.size >= UNLOCK_AFTER) unlock();
    }

    function stopAuto() {
      clearTimeout(autoTimer);
      autoTimer = null;
    }

    function queueAuto() {
      if (reduceMotion) return;
      stopAuto();
      autoTimer = setTimeout(function () {
        turn(1);
        queueAuto();
      }, DWELL);
    }

    function pauseAuto() {
      if (reduceMotion) return;
      stopAuto();
      clearTimeout(resumeTimer);
      resumeTimer = setTimeout(queueAuto, RESUME);
    }

    function manualTurn(delta) {
      pauseAuto();
      turn(delta);
    }

    const nextBtn = document.getElementById('next-btn');
    const prevBtn = document.getElementById('prev-btn');

    if (nextBtn) nextBtn.addEventListener('click', function () { manualTurn(1); });
    if (prevBtn) prevBtn.addEventListener('click', function () { manualTurn(-1); });

    cards.forEach(function (c) {
      c.addEventListener('click', function () { manualTurn(1); });
    });

    let startX = 0;
    const container = deck.parentElement;
    if (container) {
      container.addEventListener('touchstart', function (e) {
        startX = e.changedTouches[0].screenX;
      }, { passive: true });

      container.addEventListener('touchend', function (e) {
        const endX = e.changedTouches[0].screenX;
        if (startX - endX > 40) {
          manualTurn(1);
        } else if (endX - startX > 40) {
          manualTurn(-1);
        }
      }, { passive: true });
    }

    updateCards();

    // Reduced motion: nothing turns on its own, and the way forward is open.
    if (reduceMotion) unlock();
    else queueAuto();
  })();
</script></main><footer class="relative z-10 w-full text-center pt-3 pb-[calc(14px+env(safe-area-inset-bottom))] font-label-sm text-[10px] uppercase tracking-[0.28em] text-secondary/50 select-none">An Evening, Just For Two</footer></body></html>
